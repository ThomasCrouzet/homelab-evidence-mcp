---
name: Release

"on":
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: verify, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate tag
        shell: bash
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Markdown format
        run: make lint-docs

      - name: Private address scan
        run: make lint-private

      - name: Go checks
        run: |
          gofmt_output="$(gofmt -l .)"
          test -z "$gofmt_output"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          go vet ./...
          go test ./... -race -count=1 -skip '^TestStdio'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Demo
        run: go run ./demo

      - name: Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Build matrix
        shell: bash
        run: make build-matrix VERSION="${GITHUB_REF_NAME#v}"

      - name: Release binary E2E
        env:
          HEM_E2E_ARTIFACT_DIR: ${{ runner.temp }}/homelab-evidence-mcp-e2e
          HEM_E2E_BINARY: ${{ github.workspace }}/dist/homelab-evidence-mcp_linux_amd64
        run: make test-e2e

      - name: Third-party licenses
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE dist/LICENSE.txt
          module_template='{{with .Module}}{{if not .Main}}{{.Path}}{{"\t"}}'
          module_template+='{{.Version}}{{"\t"}}{{.Dir}}{{end}}{{end}}'
          module_list="$(mktemp)"
          trap 'rm -f "$module_list"' EXIT
          go list -deps -f "$module_template" \
            ./cmd/homelab-evidence-mcp |
            sed '/^[[:space:]]*$/d' | sort -u > "$module_list"
          if [ ! -s "$module_list" ]; then
            echo "No modules in the binary dependency graph" >&2
            exit 1
          fi
          {
            echo "THIRD-PARTY COMPONENT LICENSES"
            echo
            while IFS=$'\t' read -r module version dir; do
              if [ -z "$module" ]; then
                continue
              fi
              if [ -z "$dir" ]; then
                echo "No module directory for" \
                  "$module $version" >&2
                exit 1
              fi
              echo "================================================"
              echo "$module $version"
              echo "================================================"
              found=0
              while IFS= read -r license; do
                found=1
                echo
                echo "--- $(basename "$license") ---"
                cat "$license"
              done < <(
                find "$dir" -maxdepth 1 -type f \
                  \( -iname 'LICENSE*' -o -iname 'COPYING*' \
                  -o -iname 'NOTICE*' \) \
                  -print | sort
              )
              if [ "$found" -eq 0 ]; then
                echo "No license file for $module $version" >&2
                exit 1
              fi
              echo
            done < "$module_list"
          } > dist/THIRD_PARTY_LICENSES.txt

      - name: Checksums
        shell: bash
        run: |
          cd dist || exit 1
          sha256sum homelab-evidence-mcp_* LICENSE.txt \
            THIRD_PARTY_LICENSES.txt \
            > SHA256SUMS

      - name: Prepare release notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          notes_path="$RUNNER_TEMP/release-notes-${release_version}.md"
          awk -v heading="## [$release_version] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_path"
          if ! grep -q '[^[:space:]]' "$notes_path"; then
            echo "The changelog section has no release notes." >&2
            exit 1
          fi
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          body_path: ${{ steps.release-notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
