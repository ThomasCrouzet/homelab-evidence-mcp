---
name: Release

"on":
  push:
    tags: ['v*.*.*']

# Validation and publication are separate jobs. Only the publication job gets
# repository write permission, and it runs no repository code.
permissions:
  contents: read

jobs:
  verify:
    name: verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.26.11'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate tag
        id: version
        shell: bash
        run: |
          ./scripts/check-version.sh "$GITHUB_REF_NAME"
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Markdown format
        run: make lint-docs

      - name: Private address scan
        run: make lint-private

      - name: Go checks
        run: |
          gofmt_output="$(gofmt -l .)"
          test -z "$gofmt_output"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          go vet ./...
          go test ./... -race -count=1 -skip '^TestStdio'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Demo
        run: go run ./demo

      - name: Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Build matrix
        shell: bash
        run: make build-matrix VERSION="${GITHUB_REF_NAME#v}"

      - name: Release binary E2E
        env:
          HEM_E2E_ARTIFACT_DIR: ${{ runner.temp }}/homelab-evidence-mcp-e2e
          HEM_E2E_BINARY: ${{ github.workspace }}/dist/homelab-evidence-mcp_linux_amd64
        run: make test-e2e

      - name: Third-party licenses
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE dist/LICENSE.txt
          module_template='{{with .Module}}{{if not .Main}}{{.Path}}{{"\t"}}'
          module_template+='{{.Version}}{{"\t"}}{{.Dir}}{{end}}{{end}}'
          module_list="$(mktemp)"
          trap 'rm -f "$module_list"' EXIT
          go list -deps -f "$module_template" \
            ./cmd/homelab-evidence-mcp |
            sed '/^[[:space:]]*$/d' | sort -u > "$module_list"
          if [ ! -s "$module_list" ]; then
            echo "No modules in the binary dependency graph" >&2
            exit 1
          fi
          {
            echo "THIRD-PARTY COMPONENT LICENSES"
            echo
            while IFS=$'\t' read -r module version dir; do
              if [ -z "$module" ]; then
                continue
              fi
              if [ -z "$dir" ]; then
                echo "No module directory for" \
                  "$module $version" >&2
                exit 1
              fi
              echo "================================================"
              echo "$module $version"
              echo "================================================"
              found=0
              while IFS= read -r license; do
                found=1
                echo
                echo "--- $(basename "$license") ---"
                cat "$license"
              done < <(
                find "$dir" -maxdepth 1 -type f \
                  \( -iname 'LICENSE*' -o -iname 'COPYING*' \
                  -o -iname 'NOTICE*' \) \
                  -print | sort
              )
              if [ "$found" -eq 0 ]; then
                echo "No license file for $module $version" >&2
                exit 1
              fi
              echo
            done < "$module_list"
          } > dist/THIRD_PARTY_LICENSES.txt

      - name: Checksums
        shell: bash
        run: |
          cd dist || exit 1
          sha256sum homelab-evidence-mcp_* LICENSE.txt \
            THIRD_PARTY_LICENSES.txt \
            > SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          notes_path="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$release_version] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_path"
          if ! grep -q '[^[:space:]]' "$notes_path"; then
            echo "The changelog section has no release notes." >&2
            exit 1
          fi

      - name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 2

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 2

  native-smoke:
    name: native smoke (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            binary: homelab-evidence-mcp_linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
            binary: homelab-evidence-mcp_linux_arm64
          - os: macos-15-intel
            target: darwin_amd64
            binary: homelab-evidence-mcp_darwin_amd64
          - os: macos-15
            target: darwin_arm64
            binary: homelab-evidence-mcp_darwin_arm64
          - os: windows-latest
            target: windows_amd64
            binary: homelab-evidence-mcp_windows_amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.26.11'
          check-latest: false
          cache-dependency-path: go.sum

      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-dist
          path: dist

      - name: Execute native smoke suite
        shell: bash
        env:
          HEM_NATIVE_SMOKE_BINARY: ${{ github.workspace }}/dist/${{ matrix.binary }}
          HEM_NATIVE_SMOKE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          GOMAXPROCS=2 GOFLAGS=-p=1 \
            go test ./internal/mcpserver -run '^TestNativeReleaseSmoke$' -count=1 -v

  publish:
    name: publish
    needs: [verify, native-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-dist
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-notes
          path: notes

      - name: Verify transferred binaries
        shell: bash
        run: |
          cd dist || exit 1
          sha256sum -c SHA256SUMS

      - name: Attest release binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes/release-notes.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify draft asset set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort > uploaded.txt
          (cd dist && ls -1) | sort > expected.txt
          diff -u expected.txt uploaded.txt
          test -s dist/SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
