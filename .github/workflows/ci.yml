---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fuzz:
        description: Run random fuzz exploration
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: format / lint / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Get the full Git history.
          # This gives gitleaks the parent commits for pull request scans.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '1.26.11'
          check-latest: false
          cache-dependency-path: go.sum

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Markdown format
        run: make lint-docs

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files to format:"
            echo "$unformatted"
            exit 1
          fi

      - name: Private address scan
        run: make lint-private

      - name: Dependency consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Version consistency
        run: ./scripts/check-version.sh "v$(make -s print-version)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Race detection and coverage
        run: |
          go test ./... -race -coverprofile=coverage.out -covermode=atomic \
            -count=1 -skip '^TestStdio'
          go tool cover -func=coverage.out | tail -20

      - name: Short fuzzing
        if: github.event_name == 'workflow_dispatch' && inputs.fuzz
        run: |
          go test ./internal/config -run=^$ -fuzz=FuzzParse -fuzztime=8s
          go test ./internal/redaction -run=^$ -fuzz=FuzzApply -fuzztime=5s
          go test ./internal/adapters/loki -run=^$ -fuzz=FuzzParseNano -fuzztime=5s

      - name: Demo
        run: go run ./demo

      - name: Executable E2E
        env:
          HEM_E2E_ARTIFACT_DIR: ${{ runner.temp }}/homelab-evidence-mcp-e2e
        run: make test-e2e

      - name: Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Build interoperability binary
        run: make build BINARY="$RUNNER_TEMP/homelab-evidence-mcp-interop"

      - name: Install independent MCP client
        run: python3 -m pip install --disable-pip-version-check --no-input mcp==2.3.0

      - name: MCP interoperability
        run: python3 scripts/interop_check.py "$RUNNER_TEMP/homelab-evidence-mcp-interop"

      - name: Build matrix
        shell: bash
        run: make build-matrix
