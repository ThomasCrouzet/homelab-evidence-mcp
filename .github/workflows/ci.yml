---
name: CI

"on":
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: format / lint / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so gitleaks can resolve parent ranges on PRs.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Public repository hygiene
        shell: bash
        run: |
          status=0
          tailscale_ip='100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.'
          tailscale_dns='[[:alnum:].-]+\.ts\.net'
          if git grep -nIE "$tailscale_ip" -- . ':(exclude).git' ||
            git grep -nIE "$tailscale_dns" -- . ':(exclude).git'; then
            echo "Potential private Tailscale address or domain" >&2
            status=1
          fi
          exit "$status"

      - name: Dependency consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Race detection
        run: go test ./... -race -count=1

      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out | tail -20

      - name: Short fuzzing
        run: |
          go test ./internal/config -fuzz=FuzzParse -fuzztime=8s
          go test ./internal/redaction -fuzz=FuzzApply -fuzztime=5s
          go test ./internal/adapters/loki -fuzz=FuzzParseNano -fuzztime=5s

      - name: Demo
        run: go run ./demo

      - name: Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build matrix
        shell: bash
        run: |
          set -euo pipefail
          version_path="github.com/ThomasCrouzet/homelab-evidence-mcp"
          version_path+="/internal/version.Version"
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            out="dist/homelab-evidence-mcp_${os}_${arch}${ext}"
            echo "Building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X ${version_path}=0.1.0" \
              -o "$out" ./cmd/homelab-evidence-mcp
          done
          ls -la dist
