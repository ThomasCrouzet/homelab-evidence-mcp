# Example configuration for homelab-evidence-mcp.
# Copy this file outside the repository. Pass its path with --config.
# Do not put secret tokens, email addresses, or private names in Git.
# Use config.schema.json for editor validation.
# Run this command to validate the configuration without starting MCP: homelab-evidence-mcp --config path --validate

---
version: 1

limits:
  default_window: 1h
  max_incident_window: 24h
  max_cron_window: 168h
  max_log_lines: 100
  max_evidence_items: 200
  # Compact incident_context mode enforces this response budget. Default 256 KiB, min 8 KiB, max 4 MiB.
  max_incident_response_bytes: 262144
  per_source_timeout: 3s
  total_timeout: 10s
  max_log_line_bytes: 2048
  max_body_bytes: 2097152
  evidence_cache_ttl: 5m
  evidence_cache_max: 256
  # Serialized-payload budget. The default is 8 MiB and the maximum is 64 MiB.
  evidence_cache_max_bytes: 8388608
  # This source response cache keeps the same GET responses for a short time. A value of 0 deactivates it.
  # On a cache hit, observed_at keeps the initial collection time.
  # Only get_evidence sets freshness to cached. Use a low value for snapshots.
  source_cache_ttl: 15s
  max_tool_calls_per_minute: 120
  max_source_requests_per_minute: 100
  max_concurrent_tools: 8
  warn_empty_bindings: true

# Configure an optional rotating JSONL audit file.
# The application always sends audit events to stderr.
# audit:
#   file: /var/log/homelab-evidence-mcp/audit.jsonl
#   max_bytes: 10485760
#   max_files: 3

sources:
  gatus:
    kind: gatus
    base_url: https://gatus.example.internal
    # Optional per-source CA bundle. It replaces the global tls.ca_file for
    # this source only. TLS hostname verification stays active.
    # ca_file: /etc/homelab-evidence/gatus-ca.pem
    # The client keeps path prefixes.
    # For example, use https://proxy.example/gatus.
    # Optional per-source address policy. Every dial must resolve inside one
    # of these networks. This is opt-in and keeps TLS verification active.
    # allowed_cidrs: ["192.0.2.0/24", "2001:db8::/32"]
    # Use optional static headers without secrets.
    # headers:
    #   X-Scope-OrgID: lab

  loki:
    kind: loki
    base_url: https://loki.example.internal
    # Get an optional Bearer token from the environment. Do not get it from YAML.
    # token_env: LOKI_TOKEN
    # token_header: Authorization

  docker-main:
    kind: docker
    # Use a Docker socket proxy that lets the client use only GET routes.
    # The client cannot use the unix:///var/run/docker.sock socket.
    base_url: http://docker-proxy.example.internal:2375
    # Optional. Use a versioned Engine API route and allow that exact read
    # route in the socket proxy. Unversioned routes are deprecated.
    # api_version: v1.56

  healthchecks:
    kind: healthchecks
    base_url: https://healthchecks.example.internal
    # Set a read-only key through the environment or a private token_file.
    token_env: HEALTHCHECKS_API_TOKEN
    # token_file: /run/secrets/healthchecks_api_token

  beszel:
    kind: beszel
    base_url: https://beszel.example.internal
    # Get an optional Bearer token from the environment for the PocketBase API.
    # token_env: BESZEL_TOKEN

  ntfy:
    kind: ntfy
    base_url: https://ntfy.example.internal

# Add optional redaction rules. Built-in rules remain active.
redact:
  - exact: "example-local-token-value"
  - regex: '(?i)sessionid=[A-Za-z0-9]+'

services:
  - id: reverse-proxy
    display_name: Reverse Proxy
    sources:
      gatus:
        source: gatus
        endpoint_key: infra_proxy
      docker:
        source: docker-main
        container_name: caddy
      loki:
        source: loki
        selector: '{container="caddy"}'
      healthchecks:
        source: healthchecks
        check_tags: [proxy]
        # With a read-only API key, bind the check by its unique_key:
        # check_unique_key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        # Use transitions to include dated down/up history in windowed reads.
        # history_mode: transitions
      beszel:
        source: beszel
        system_name: proxy-host
      ntfy:
        source: ntfy
        topic: proxy-alerts

  - id: media
    display_name: Media Server
    sources:
      gatus:
        source: gatus
        endpoint_key: media_app
      docker:
        source: docker-main
        container_name: media
      loki:
        source: loki
        selector: '{container="media"}'
      healthchecks:
        source: healthchecks
        check_tags: [media]
        # status_filter: down

  - id: git-forge
    display_name: Git Forge
    sources:
      gatus:
        source: gatus
        endpoint_key: forge_web
      docker:
        source: docker-main
        container_name: gitea
      loki:
        source: loki
        selector: '{container="gitea"}'

  - id: monitoring
    display_name: Monitoring Stack
    sources:
      gatus:
        source: gatus
        endpoint_key: monitoring_grafana
      docker:
        source: docker-main
        container_name: grafana
      loki:
        source: loki
        selector: '{container="grafana"}'
      healthchecks:
        source: healthchecks
        check_name: monitoring-heartbeat
