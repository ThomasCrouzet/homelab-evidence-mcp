<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Homelab evidence collection flow</title>
  <desc id="desc">A stdio MCP request selects a service ID. A configured registry maps it to Gatus, Docker, Loki, Healthchecks, Beszel, and ntfy. GET-only collection, limits, redaction, and timestamp handling produce a bounded evidence timeline. Correlation does not identify a root cause.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#247d76"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#193d3b}.title{font-size:30px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#516d69}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#247d76}.box{fill:#fff;stroke:#c7ded9;stroke-width:1.5}.line{fill:none;stroke:#247d76;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="640" rx="24" fill="#f2f8f6"/>
  <text x="40" y="39" class="eyebrow">HOMELAB EVIDENCE / DATA FLOW</text>
  <text x="40" y="79" class="title">Six sources. One service timeline.</text>
  <path d="M40 106H1080" stroke="#c7ded9"/>
  <text x="40" y="149" class="eyebrow">SOURCE RESPONSES</text>
  <rect x="40" y="168" width="270" height="50" rx="10" class="box"/><text x="60" y="199" class="body">Gatus / endpoint status</text>
  <rect x="40" y="230" width="270" height="50" rx="10" class="box"/><text x="60" y="261" class="body">Docker / container state</text>
  <rect x="40" y="292" width="270" height="50" rx="10" class="box"/><text x="60" y="323" class="body">Loki / selected log streams</text>
  <rect x="40" y="354" width="270" height="50" rx="10" class="box"/><text x="60" y="385" class="body">Healthchecks / job status</text>
  <rect x="40" y="416" width="270" height="50" rx="10" class="box"/><text x="60" y="447" class="body">Beszel / host snapshot</text>
  <rect x="40" y="478" width="270" height="50" rx="10" class="box"/><text x="60" y="509" class="body">ntfy / selected topic</text>
  <path d="M310 193H350V503H310M310 255H350M310 317H350M310 379H350M310 441H350" fill="none" stroke="#247d76" stroke-width="2"/>
  <path d="M350 349H398" class="line"/>
  <rect x="400" y="145" width="300" height="82" rx="14" class="box"/>
  <text x="422" y="179" class="label">MCP client / stdio</text>
  <text x="422" y="207" class="body">Tool request + service_id</text>
  <path d="M550 227V270" class="line"/>
  <rect x="400" y="272" width="300" height="154" rx="14" class="box"/>
  <text x="422" y="308" class="label">Bounded collection</text>
  <text x="422" y="340" class="body">GET-only adapters</text>
  <text x="422" y="369" class="body">Timeouts + response cache</text>
  <text x="422" y="401" class="small">Fixed destinations / redaction</text>
  <path d="M550 483V428" class="line"/>
  <rect x="400" y="485" width="300" height="74" rx="14" class="box"/>
  <text x="422" y="515" class="label">Service registry</text>
  <text x="422" y="540" class="body">Configured source bindings</text>
  <path d="M700 349H758" class="line"/>
  <rect x="760" y="247" width="320" height="204" rx="16" fill="#193d3b"/>
  <text x="784" y="285" style="font:700 22px Arial,Helvetica,sans-serif;fill:#fff">Evidence timeline</text>
  <path d="M791 309V416" stroke="#79c3b4" stroke-width="2"/>
  <circle cx="791" cy="321" r="5" fill="#79c3b4"/><circle cx="791" cy="359" r="5" fill="#79c3b4"/><circle cx="791" cy="397" r="5" fill="#79c3b4"/>
  <text x="808" y="327" style="font:16px Arial,Helvetica,sans-serif;fill:#ecf6f2">Source + timestamps</text>
  <text x="808" y="365" style="font:16px Arial,Helvetica,sans-serif;fill:#ecf6f2">Freshness + source state</text>
  <text x="808" y="403" style="font:16px Arial,Helvetica,sans-serif;fill:#ecf6f2">Truncation + redaction count</text>
  <text x="780" y="484" class="small">Ordered by observed_at</text>
  <text x="780" y="508" class="small">Opaque IDs support get_evidence</text>
  <text x="40" y="607" class="body">Correlation presents evidence. It does not establish a root cause or change upstream services.</text>
</svg>
